name: shraddha-hospital-db

services:
  postgres:
    image: postgres:16-alpine
    container_name: shraddha-hospital-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shraddha
      POSTGRES_PASSWORD: shraddha
      POSTGRES_DB: shraddha
    ports:
      - "55432:5432"
    volumes:
      - shraddha_pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/00-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shraddha -d shraddha"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shraddha_pgdata: